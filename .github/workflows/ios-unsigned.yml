name: Build unsigned iOS IPA

# ── 排队问题的真实原因（2026-10）──────────────────────────────────────────────
# 1. macos-14 于 2026-11-02 退役，GitHub 已在过渡期**削减它的容量**，还额外排了
#    8 个 brownout（临时故意失败）窗口。继续用 macos-14 的作业会一直停在
#    "Waiting for a runner to pick up this job"，直到超时——这正是本仓库之前的现象。
#    受影响的标签：macos-14 / macos-14-large / macos-14-xlarge（全部不要再写）。
#    官方推荐迁移到：macos-latest(=macos-26) / macos-15 / *-xlarge。
# 2. 公开仓库的 macOS 分钟免费，所以排队与额度、付款方式无关，纯粹是机器容量。
#    私有仓库的 macOS 分钟按 10 倍扣（Free 2000 分钟/月 ≈ 200 分钟 macOS），额度耗尽也会排队。
#
# 本 workflow 的对策：
#   - 默认 auto 只排 xcode-27（macOS 27 + Xcode 27 / iOS 27 SDK）。以前是 macos-15 +
#     macos-26 一起抢，命中率高，但旧 SDK 打出来的包在新机型上会黑边（见下），所以砍掉了。
#   - 队列等待时间不计入失败：job 超时放宽到 150 分钟，真正的工作量由各 step 的
#     timeout-minutes 卡住（准备工具链 14、装 XcodeGen 6、生成工程 10、归档 20、打包 5），
#     不会出现"排了两小时被 30 分钟硬超时杀掉"，也不会出现某一步静默挂一小时。
#   - concurrency 取消同一分支的重复触发，避免自己挤自己。
#
# ── 为什么 auto 不再带 macos-15（2026-10-29）────────────────────────────────
#   macos-15 默认装的是 Xcode 16（iOS 18 SDK）。用低于 iOS 26 的 SDK 打出来的包，
#   在 iPhone 17 / iOS 27 上会被系统按「兼容模式」运行：内容缩在中间，屏幕上下一条黑边。
#   用户实测就是这个问题。所以 auto 只排 macos-26（Xcode 26），macos-15 只能手动选，
#   并且构建前会硬性检查 SDK 版本，低于 26 直接失败。
#
# ── 2026-10-30 更正：26 也不够，要 27 ────────────────────────────────────────
#   系统的「兼容窗口」是**按打包用的 SDK 版本**分档的，跟设备型号无关：
#     iOS 26 及更早 SDK → 默认兼容：整个 App 缩进一个旧尺寸的窗口里居中显示，四周黑边；
#     iOS 27 SDK        → 过渡适配：窗口能铺到屏幕边缘，只剩很细的边；
#     iOS 27.1 SDK 及以上 → 完全适配：真正铺满。
#   用户实测「27 系统 + 26 SDK」还有上下各 4px 黑边（1206×2622 的截图按 393×852 排版再放大，
#   402/393 = 1.0229），正好对上「默认兼容」这一档。所以这里改成：
#     - 优先选机器上最新的一版 Xcode（同主版本里按次版本比，且优先非 beta）；
#     - SDK < 26 直接失败；26 ≤ SDK < 27 打成警告并写进构建摘要（能出货，但可能仍有黑边）；
#       SDK 27.0 再提醒一次——它是「过渡适配」，27.1 起才完全铺满。
#
# ── 运行器标签：没有 macos-27，只有 xcode-27（2026-10-30）──────────────────
#   GitHub 的 macOS 镜像自 Xcode 26 起改成「按工具链命名」，所以 Xcode 27 镜像的标签是
#   xcode-27 / xcode-27-xlarge，不是 macos-27（后者根本不存在，写上只会一直排队到超时）。
#   2026-10-15 起 xcode-27 已转正式可用（GA），基于 macOS 27，默认装了
#   Xcode 27.0（另有 27.1 RC、27.2 beta），且**只有 arm64**，没有 Intel 版本。
#   机器上的 Xcode 名字是 /Applications/Xcode_27.app 这种，下面的「挑最新 Xcode」照样能选中。
#
# ── 2026-10-30 第二次更正：卡在「环境信息」（4m47s 无输出）──────────────────────
#   第一次用 xcode-27 跑，作业已经领到机器、checkout 完成，然后「环境信息」一步
#   输出全无、一直转圈。原因不是网络也不是排队，而是那一步直接调了
#   `xcodebuild -version` / `xcrun --show-sdk-version`：
#   全新镜像上**第一次**启动 xcodebuild 会去初始化组件、校验 Xcode.app，
#   非交互环境下既不弹提示也不打印任何东西，能空转十几分钟。
#   对策：
#     1. 「环境信息」改成纯读 plist（Contents/version.plist、SDKSettings.plist），
#        一个 Xcode 二进制都不启动，秒出；
#     2. 真正会卡的 xcodebuild 调用挪到「选择机器上最新的 Xcode」之后，
#        先 `-license accept` + `-runFirstLaunch`，每个调用再套 `perl -e 'alarm ...'` 上限；
#     3. 每一步都写死 timeout-minutes，卡住就是明确失败，不再静默挂到 150 分钟。

# ── 构建时长（2026-10-30 精简）───────────────────────────────────────────────
#   原来一次要跑 10 个 step，其中 3 个是纯诊断（还各起一次 xcodebuild），
#   合计多花 1.5~3 分钟。后来压到 6 个、现在 5 个（又去掉了缓存那步），且没有任何重复的 xcodebuild：
#     1. 准备工具链（选 Xcode + 初始化 + 校验 SDK + 定位工程，合并了原来 4 个 step）
#     2. 安装 XcodeGen（下载 4MB 预编译包，不是 brew）
#     3. 生成工程（xcodegen + 两处自愈，纯文本处理，不启动 xcodebuild）
#     4. 归档
#     5. 打包 IPA / 上传（缓存那一步已删除，见下）
#   删掉的东西：
#     · `xcodebuild -list`：只是列 scheme，没人看，还要启动一次 Xcode；
#     · `-resolvePackageDependencies` 单独一步：归档时本来就会解析，白跑一遍；
#     · `-showBuildSettings` 检查产物名：那是全图求解，最慢的一步；
#       现在改成在 pbxproj 里数 `PRODUCT_NAME = OpenWrtMonitor;` 的条数，毫秒级；
#     · `-resultBundlePath`：xcresult 有几十 MB 却从没提供过有效信息，日志就够。
#   剩下真正耗时的只有两件，都是没法绕的：openssl/ssh2 的 C 编译，以及 Swift 编译本身。
#   归档命令加了 -showBuildTimingSummary，构建末尾会打印各阶段耗时，哪里慢一眼能看到。
#
# ── 2026-10-30 第三次精简：去掉 actions/cache（那 1.2GB 的「缓存」步）──────────
#   原来第 4 步是 actions/cache，缓存 build/spm（SPM 源码）+ build/DerivedData
#   （编译中间产物），日志里 Cache Size 是 1248 MB。它**不影响能不能出包，
#   也不影响包里的内容**：从头编一遍得到的是同一个 IPA（只有时间戳不同）；
#   而且那一行本来就写着 continue-on-error，缓存失败照样往下走。
#   代价却是实打实的：
#     · 恢复：每次作业开始都要从缓存服务器拉 1.2GB，按 50MB/s 算就是 25~35 秒；
#     · 保存：key 里带了 ios/Sources/** 的哈希，改一行 Swift 就算 miss，
#       于是每轮都按新 key 再上传一份 1.2GB，又是几十秒；
#     · 仓库缓存配额 10GB，这么传七八轮就把自己挤掉，等于白传。
#   而它省下的只有 openssl / ssh2 的 C 编译和 Swift 增量编译，在这个工程里也就
#   1~2 分钟量级，跟「恢复 + 保存」的固定开销差不太多。
#   现在整条链路不带任何缓存，每次都是干净的冷编译，行为可预测——也不会再出现
#   「复用了上一轮的 DerivedData、编出来的东西和源码对不上」这类玄学失败。
#   以后真想加快，正确做法是只缓存 build/spm 那一个小目录（源码包，几十 MB），
#   别缓存 DerivedData。
#
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "运行器（auto = xcode-27：macOS 27 + Xcode 27 / iOS 27 SDK，才没有上下黑边）"
        type: choice
        default: auto
        options:
          # GitHub 没有 macos-27 这个标签。Xcode 27 镜像是按工具链命名的：xcode-27。
          - auto
          - xcode-27       # macOS 27 + Xcode 27（iOS 27 SDK），2026-10-15 转正式可用
          - macos-26       # Xcode 26 / iOS 26 SDK：能出包，但新机型上仍有黑边
          - macos-15       # 旧 SDK，仅排查用
          - macos-15-intel

permissions:
  contents: read

# ⚠️ 写这个文件里的 shell 时，变量紧挨着中文/全角标点必须写成 ${var}。
# macOS 运行器的 /bin/bash 是 3.2，不认 UTF-8：`${app}（` 会把「（」的第一个字节
# 当成变量名的一部分，去找一个叫 `app\xef` 的变量；因为脚本开头有 set -u，
# 于是直接 `app?: unbound variable` 报错退出（2026-10-30 实际踩过一次）。

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.46.0"

jobs:
  # 单独一个几秒就起来的 Linux job 决定构建矩阵，出错时一眼能看出选的是哪个标签。
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: 选择运行器
        id: pick
        env:
          CHOICE: ${{ inputs.runner || 'auto' }}
        run: |
          set -eu
          case "$CHOICE" in
            auto)
              json='["xcode-27"]'
              note="auto：xcode-27（macOS 27 + Xcode 27 / iOS 27 SDK，界面才真正铺满）"
              ;;
            macos-27*)
              # 常见误会：GitHub 上并没有 macos-27 这个运行器标签。
              # Xcode 27 的镜像按工具链命名，label 是 xcode-27（arm64 专用）。
              echo "::warning::GitHub 没有 macos-27 标签，Xcode 27 镜像的标签是 xcode-27，已自动换成 xcode-27"
              json='["xcode-27"]'
              note="macos-27 → 已自动换成 xcode-27"
              ;;
            xcode-27*)
              json='["xcode-27"]'
              note="指定运行器：xcode-27（macOS 27 + Xcode 27）"
              ;;
            macos-14*)
              echo "::warning::macos-14 系列将于 2026-11-02 退役且容量已被削减，自动改用 xcode-27"
              json='["xcode-27"]'
              note="macos-14 → 已自动换成 xcode-27"
              ;;
            macos-15|macos-26|macos-15-intel|macos-26-intel)
              if [ "${CHOICE#macos-15}" != "$CHOICE" ]; then
                echo "::warning::macos-15 是旧 SDK，打出来的包在新机型上会上下黑边，仅建议排查用"
              fi
              if [ "$CHOICE" = "macos-26" ] || [ "$CHOICE" = "macos-26-intel" ]; then
                echo "::warning::macos-26 只有 iOS 26 SDK，系统仍按兼容窗口运行，上下会留黑边"
              fi
              json="[\"$CHOICE\"]"
              note="指定运行器：$CHOICE"
              ;;
            *)
              echo "::warning::未知运行器 '$CHOICE'，回退到 xcode-27"
              json='["xcode-27"]'
              note="未知输入，回退 xcode-27"
              ;;
          esac
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "本次构建目标：$note" >> "$GITHUB_STEP_SUMMARY"
          echo "$note"

  build:
    needs: plan
    strategy:
      # 一个池子排不上不影响另一个，谁先起来谁先出包
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # 排队时间也算在 job 超时里，所以给足；真正的工时长由下面各 step 卡住
    timeout-minutes: 150
    steps:
      # checkout@v5 起改用 Node 24 运行时。v4 是 Node 20，跑起来会有
      # 「Node.js 20 已被弃用，强制在 Node.js 24 执行」的告警，指的就是这一行。
      - uses: actions/checkout@v5

      # 一步做完：读环境 → 选最新 Xcode → 首次初始化 → 校验 SDK → 定位工程。
      #
      # 原来这里是 4 个 step（环境信息 / 选择 Xcode / 检查 SDK / 定位工程），
      # 每个 step 都要重起一次 shell、重扫一遍 /Applications，纯属排队等进程启动。
      # 合并成一步后日志也短了，构建整体少 30~60 秒。
      #
      # 版本号、SDK 版本全部只读 plist 文件，几毫秒出结果；
      # 真正会卡住的只有 xcodebuild 的首次初始化，所以单独套 alarm 上限。
      - name: 准备工具链（选 Xcode + 校验 SDK）
        timeout-minutes: 14
        run: |
          set -u
          w() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          sw_vers | sed -n '1,3p'
          echo "runner: ${RUNNER_NAME} / ${RUNNER_ARCH} / 标签 ${{ matrix.runner }}"

          # ── 1. 挑版本最高的 Xcode（读 version.plist，不启动 Xcode）──────────
          # 打分：版本号优先（27.2 > 27.1 > 27.0），同版本非 beta 优先。
          # 镜像里 Xcode 27.0 是默认，但只有 27.1 起才完全铺满，所以必须显式切。
          best=""
          best_key=-1
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            name="$(basename "$app")"
            v="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
                  "$app/Contents/version.plist" 2>/dev/null || true)"
            [ -n "$v" ] || v="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
                  "$app/Contents/Info.plist" 2>/dev/null || echo 0)"
            major="${v%%.*}"
            rest="${v#*.}"
            minor="${rest%%.*}"
            case "$major" in ''|*[!0-9]*) major=0 ;; esac
            case "$minor" in ''|*[!0-9]*) minor=0 ;; esac
            raw=$(( major * 1000 + minor ))
            case "$name" in
              *beta*|*Beta*|*BETA*) key=$(( raw * 2 - 1 )) ;;
              *)                    key=$(( raw * 2 )) ;;
            esac
            echo "  ${name} = ${v}（权重 ${key}）"
            if [ "$key" -gt "$best_key" ]; then
              best="$app"
              best_key="$key"
            fi
          done
          if [ -n "$best" ]; then
            sudo xcode-select -s "$best"
            echo "已切到 ${best}"
          else
            echo "::warning::/Applications 下没找到 Xcode*.app，沿用当前指向"
          fi

          # ── 2. 首次初始化 + 实际版本（只有这两条会慢，给上限）─────────────
          sudo xcodebuild -license accept >/dev/null 2>&1 || true
          w 420 sudo xcodebuild -runFirstLaunch || echo "::warning::-runFirstLaunch 失败或超时，继续"
          echo "=== 实际生效的版本 ==="
          w 300 xcodebuild -version || echo "::warning::xcodebuild -version 失败或超时"

          # ── 3. iPhoneOS SDK 版本（读 SDKSettings.plist，读不到才问 xcrun）──
          sdkp="$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk/SDKSettings.plist"
          sdk="$(/usr/libexec/PlistBuddy -c 'Print :Version' "$sdkp" 2>/dev/null | tr -dc '0-9.')"
          if [ -z "$sdk" ]; then
            sdk="$(w 120 xcrun --sdk iphoneos --show-sdk-version 2>/dev/null | tr -dc '0-9.')"
            echo "SDKSettings.plist 没读到，改用 xcrun：${sdk:-空}"
          fi
          if [ -z "$sdk" ]; then
            echo "::error::取不到 iphoneos SDK 版本（plist 和 xcrun 都失败），无法确认会不会黑边。"
            exit 1
          fi
          major="${sdk%%.*}"
          rest="${sdk#*.}"
          minor="${rest%%.*}"
          case "$major" in ''|*[!0-9]*) major=0 ;; esac
          case "$minor" in ''|*[!0-9]*) minor=0 ;; esac
          echo "检测到 iphoneos SDK: ${sdk}"
          # 系统的「兼容窗口」按打包 SDK 分档：≤26 有黑边，27.0 过渡，27.1+ 完全铺满。
          if [ "$major" -lt 26 ]; then
            echo "::error::当前 iOS SDK 是 ${sdk}（低于 26）。用它打出来的包在新机型上会被系统按兼容模式运行，屏幕上下有黑边。请改用 xcode-27 运行器。"
            exit 1
          elif [ "$major" -lt 27 ]; then
            echo "::warning::iOS SDK 是 ${sdk}（低于 27）。系统会按「默认兼容」档运行，上下仍有黑边，换 xcode-27 才能铺满。"
            {
              echo ""
              echo "> ⚠️ 本次打包用的是 iOS ${sdk} SDK（< 27）：系统会把界面放进旧尺寸兼容窗口，上下仍会留黑边。"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$minor" -lt 1 ]; then
            echo "::warning::iOS SDK 是 ${sdk}（27.0）。这一档是「过渡适配」，偶尔还能看到极细的边；27.1 起才完全铺满。"
          else
            echo "SDK 版本满足要求（${sdk} ≥ 27.1），界面可以完全铺满屏幕"
          fi

          # ── 4. 定位 iOS 工程（后面各步用 ${IOS_DIR}）───────────────────────
          if [ -f ios/project.yml ]; then
            echo "IOS_DIR=ios" >> "$GITHUB_ENV"
          elif [ -f project.yml ]; then
            echo "IOS_DIR=." >> "$GITHUB_ENV"
          else
            echo "::error::找不到 project.yml，请确认仓库根目录下是 ios/project.yml"
            exit 1
          fi

      # brew install xcodegen 自带 auto-update，一步就可能 3~5 分钟，还常因网络抖动重试。
      # 改成下 4MB 官方预编译包，通常几秒装完。
      - name: 安装 XcodeGen
        timeout-minutes: 6
        run: |
          set -eu
          if command -v xcodegen >/dev/null 2>&1; then
            echo "系统已有 XcodeGen：$(xcodegen --version)"
            exit 0
          fi
          url="https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "下载 $url"
          if curl -fsSL --retry 3 --retry-delay 2 --max-time 120 -o /tmp/xcodegen.zip "$url"; then
            rm -rf /tmp/xg && mkdir -p /tmp/xg
            unzip -q /tmp/xcodegen.zip -d /tmp/xg
            bin="$(find /tmp/xg -type f -name xcodegen | head -n 1)"
            if [ -n "$bin" ] && [ -x "$bin" ]; then
              root="$(dirname "$(dirname "$bin")")"
              sudo mkdir -p /opt/xcodegen
              sudo cp -R "$root"/. /opt/xcodegen/
              sudo ln -sf /opt/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
            fi
          fi
          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "::warning::预编译包没装上，退回 Homebrew"
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        working-directory: ${{ env.IOS_DIR }}
        timeout-minutes: 10
        run: |
          set -u
          xcodegen generate
          test -d OpenWrtMonitor.xcodeproj || { echo "::error::xcodegen 没生成工程"; exit 1; }
          pbx=OpenWrtMonitor.xcodeproj/project.pbxproj

          # ── 自愈：产物名 ────────────────────────────────────────────────
          # 仓库里的 project.yml 若是旧版（没有 PRODUCT_NAME），生成的工程里就缺这一项，
          # 归档产物会变成 Applications/.app 并报「Multiple commands produce」。
          # 这里不依赖那个文件，直接把它补进生成的工程：锚点是 target 里的
          # PRODUCT_BUNDLE_IDENTIFIER，位置稳定。
          #
          # 注意：只能写进**工程**。在 xcodebuild 命令行上写 PRODUCT_NAME=xxx 是全局覆盖，
          # 会连带把依赖包里的 OpenSSL / SSH2 也改名，反而制造出新的 Multiple commands produce。
          if grep -q 'PRODUCT_NAME = "";' "$pbx"; then
            echo "::warning::工程里的 PRODUCT_NAME 是空串，改成 OpenWrtMonitor"
            perl -pi -e 's/PRODUCT_NAME = "";/PRODUCT_NAME = OpenWrtMonitor;/g' "$pbx"
          fi
          # 对每个「还没紧跟 PRODUCT_NAME」的 bundle id 行补一行，
          # Debug / Release 两个配置各补一次，已经有的不重复插。
          if ! grep -q 'PRODUCT_NAME = OpenWrtMonitor;' "$pbx"; then
            echo "::warning::生成出来的工程里没有 PRODUCT_NAME（仓库的 ios/project.yml 可能是旧版），这里自动补上"
          fi
          perl -0pi -e 's/(\n(\s*)PRODUCT_BUNDLE_IDENTIFIER = com\.catmint\.openwrtmonitor;)(?!\n\s*PRODUCT_NAME)/$1\n$2PRODUCT_NAME = OpenWrtMonitor;/g' "$pbx"
          pname_hits="$(grep -c 'PRODUCT_NAME = OpenWrtMonitor;' "$pbx" || true)"
          echo "工程里 PRODUCT_NAME = OpenWrtMonitor 出现 ${pname_hits} 处"
          if [ "${pname_hits:-0}" -eq 0 ]; then
            echo "::error::没能把 PRODUCT_NAME 写进工程（锚点没命中）。请确认 ios/project.yml 的 settings.base 里有 PRODUCT_NAME: OpenWrtMonitor 和 PRODUCT_BUNDLE_IDENTIFIER: com.catmint.openwrtmonitor。"
            grep -m5 -n 'PRODUCT_BUNDLE_IDENTIFIER' "$pbx" || true
            exit 1
          fi

          # ── 自愈：Info.plist 别同时当资源 ──────────────────────────────
          # 它已经由 info: 生成并作为 INFOPLIST_FILE 使用；如果旧版 project.yml 没写
          # excludes，它还会被塞进 Copy Bundle Resources，于是报
          # 「Multiple commands produce .../Info.plist」。删掉相册里那两条引用即可。
          if grep -q '/\* Info\.plist in Resources \*/' "$pbx"; then
            echo "::warning::Info.plist 被当成了资源，删掉这两条引用（它只应作为 INFOPLIST_FILE）"
            perl -ni -e 'print unless m{/\* Info\.plist in Resources \*/}' "$pbx"
          fi
          echo "Resources 阶段里还有没有 Info.plist：$(grep -c '/\* Info\.plist in Resources \*/' "$pbx" || true)"

      # ── 这里原来有一步 actions/cache ────────────────────────────────────
      # 缓存 build/spm + build/DerivedData，体积 1248 MB。已删除，原因见文件开头
      # 「第三次精简」。删掉它不影响出包，也不影响包的内容，只是每次都要从零编一遍
      # openssl / ssh2。真要加速就只缓存 build/spm（几十 MB），别缓存 DerivedData。
      - name: 构建（不签名）
        working-directory: ${{ env.IOS_DIR }}
        timeout-minutes: 20
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project OpenWrtMonitor.xcodeproj \
            -scheme OpenWrtMonitor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/OpenWrtMonitor.xcarchive \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/spm \
            -showBuildTimingSummary \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build/archive.log

      - name: 打包 IPA
        working-directory: ${{ env.IOS_DIR }}
        timeout-minutes: 5
        run: |
          set -eu
          app="build/OpenWrtMonitor.xcarchive/Products/Applications/OpenWrtMonitor.app"
          test -d "$app"

          # 产物里必须真的记着这两项，否则系统照样按旧版小屏 App 处理（四周黑边）。
          built_sdk="$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$app/Info.plist" 2>/dev/null || echo 未知)"
          launch="$(/usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$app/Info.plist" 2>/dev/null || echo 缺失)"
          echo "产物 DTSDKName: $built_sdk"
          echo "产物 UILaunchScreen: $launch"
          case "$launch" in
            缺失|"") echo "::error::产物 Info.plist 里没有 UILaunchScreen，系统会把 App 当旧版小屏应用加黑边。" ; exit 1 ;;
          esac

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$app" build/Payload/
          rm -f build/OpenWrtMonitor-unsigned.ipa
          (cd build && /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload OpenWrtMonitor-unsigned.ipa)
          shasum -a 256 build/OpenWrtMonitor-unsigned.ipa | tee build/ipa.sha256
          size="$(du -h build/OpenWrtMonitor-unsigned.ipa | cut -f1)"
          sha="$(cut -d' ' -f1 build/ipa.sha256)"
          # 摘要里的 Xcode 版本也改成读文件，别在这里再启一次 xcodebuild
          xv="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
                 "$(xcode-select -p)/../version.plist" 2>/dev/null || echo 未知)"
          {
            echo "### 构建成功（${{ matrix.runner }}）"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 运行器 | \`${RUNNER_NAME}\` |"
            echo "| Xcode | \`${xv}\` |"
            echo "| 产物 SDK（DTSDKName） | \`${built_sdk}\` |"
            echo "| IPA 大小 | ${size} |"
            echo "| SHA256 | \`${sha}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # upload-artifact 要到 v6 才是 Node 24 运行时（v4/v5 都还是 Node 20，会继续报那条弃用告警）。
      # v6 的上传语义和 v4 一致：产物仍打成 zip、同名不可覆盖、if-no-files-found 同义，参数不用改。
      - name: 上传 IPA
        uses: actions/upload-artifact@v6
        with:
          # 带上运行器名，auto 模式下两个池子各出一份，下哪个都一样
          name: OpenWrtMonitor-unsigned-ipa-${{ matrix.runner }}
          path: ${{ env.IOS_DIR }}/build/OpenWrtMonitor-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      # 以前这里连 xcresult 一起上传（几十 MB），但真正有用的信息全在 archive.log 里，
      # 所以现在只传日志：失败产物从 8~40MB 降到十几 KB，下载也快。
      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-failure-${{ matrix.runner }}
          path: ${{ env.IOS_DIR }}/build/archive.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 失败提示
        if: failure()
        run: |
          echo "::error::构建失败或超时，已上传 archive.log，先看里面最后一个 error: 行。"
          echo "若全程停在 Queued（等机器），说明该标签的池子满：重跑一次，或改用默认的 auto。"
