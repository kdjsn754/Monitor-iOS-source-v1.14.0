name: OpenWrtMonitor
options:
  bundleIdPrefix: com.catmint
  deploymentTarget:
    iOS: "17.0"
  projectFormat: xcode15_3
  xcodeVersion: "26.0"
  createIntermediateGroups: true
packages:
  SSH2:
    path: Packages/libssh2-apple
targets:
  OpenWrtMonitor:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: SSH2
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: OpenWrt 监控
        NSLocalNetworkUsageDescription: 用于通过 SSH 连接局域网内的 OpenWrt 路由器
        NSBonjourServices:
          - _ssh._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # 全屏的前提：有 UILaunchScreen（哪怕是空字典）系统才认为这是「现代 App」，
        # 否则会按旧版小屏 App 处理，四周强制加黑边。
        UILaunchScreen: {}
        # UIRequiresFullScreen 在 iOS 26 已废弃（iPad 多任务相关），对 iPhone 无意义，
        # 留着只会让系统按「老 App」对待，删掉更安全。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catmint.openwrtmonitor
        MARKETING_VERSION: 1.28.0
        CURRENT_PROJECT_VERSION: 41
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  OpenWrtMonitor:
    build:
      targets:
        OpenWrtMonitor: all
    run:
      config: Debug
    archive:
      config: Release
