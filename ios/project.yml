name: OpenWrtMonitor
options:
  bundleIdPrefix: com.catmint
  deploymentTarget:
    iOS: "17.0"
  projectFormat: xcode15_3
  xcodeVersion: "26.0"
  createIntermediateGroups: true
packages:
  SSH2:
    path: Packages/libssh2-apple
targets:
  OpenWrtMonitor:
    type: application
    platform: iOS
    sources:
      # Info.plist 由下面的 info: 生成并作为 INFOPLIST_FILE 使用，
      # 不能再当资源复制一遍，否则会报「Multiple commands produce …/Info.plist」。
      - path: Sources
        excludes:
          - Info.plist
    dependencies:
      - package: SSH2
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: OpenWrt 监控
        NSLocalNetworkUsageDescription: 用于通过 SSH 连接局域网内的 OpenWrt 路由器
        NSBonjourServices:
          - _ssh._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # 全屏的前提：有 UILaunchScreen（哪怕是空字典）系统才认为这是「现代 App」，
        # 否则会按旧版小屏 App 处理，四周强制加黑边。
        UILaunchScreen: {}
        # UIRequiresFullScreen 在 iOS 26 已废弃（iPad 多任务相关），对 iPhone 无意义，
        # 留着只会让系统按「老 App」对待，删掉更安全。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        # ⚠️ 必须显式写 PRODUCT_NAME：XcodeGen 不写这一项时，Xcode 会拿默认的
        # $(TARGET_NAME) 去解析，一旦解析成空串，归档产物就变成 Applications/.app，
        # 于是「建目录」和「链接」两条命令抢同一个输出，报
        # error: Multiple commands produce '.../Applications/.app'（2026-10-30 实际踩过）。
        PRODUCT_NAME: OpenWrtMonitor
        # Swift 模块名跟着 PRODUCT_NAME 走，显式写出来，避免以后改显示名时把
        # 模块名带歪（改了模块名，所有源文件都不需要动，但 import 会变）。
        PRODUCT_MODULE_NAME: OpenWrtMonitor
        PRODUCT_BUNDLE_IDENTIFIER: com.catmint.openwrtmonitor
        MARKETING_VERSION: 1.28.5
        CURRENT_PROJECT_VERSION: 46
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        # 新版构建系统已经不支持老式 headermap，这里显式关掉，避免那条
        # "Traditional headermap style is no longer supported" 警告。
        ALWAYS_SEARCH_USER_PATHS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  OpenWrtMonitor:
    build:
      targets:
        OpenWrtMonitor: all
    run:
      config: Debug
    archive:
      config: Release
