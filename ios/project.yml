name: OpenWrtMonitor
options:
  bundleIdPrefix: com.catmint
  deploymentTarget:
    iOS: "17.0"
  projectFormat: xcode15_3
  xcodeVersion: "15.4"
  createIntermediateGroups: true
packages:
  SSH2:
    path: Packages/libssh2-apple
targets:
  OpenWrtMonitor:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: SSH2
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: OpenWrt 监控
        NSLocalNetworkUsageDescription: 用于通过 SSH 连接局域网内的 OpenWrt 路由器
        NSBonjourServices:
          - _ssh._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catmint.openwrtmonitor
        MARKETING_VERSION: 1.18.0
        CURRENT_PROJECT_VERSION: 31
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  OpenWrtMonitor:
    build:
      targets:
        OpenWrtMonitor: all
    run:
      config: Debug
    archive:
      config: Release
